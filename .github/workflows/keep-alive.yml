# Keep the free Render API instance warm.
#
# Render's free tier spins the service down after inactivity, and a first
# request after idle can take ~50 s. This workflow pings /api/health every
# 10 minutes so the instance stays warm. Free on a public repo (GitHub
# Actions free tier); a single curl costs nothing.
#
# If the API is ever down for real, this job fails — the failure itself is
# the alert. It does not page anyone; check the Actions tab.

name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public API health endpoint
        run: |
          curl -fsS -m 60 https://nodefield-api.onrender.com/api/health
